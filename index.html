<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08070c">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="NOIR">
<meta name="description" content="NOIR: Last Call — a five-minute murder mystery. Lies, alibis, a ticking clock. A new case every time.">
<title>NOIR: Last Call</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 10 10%27%3E%3Ctext y=%278.5%27 font-size=%278%27%3E%F0%9F%95%B5%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head><body>
<canvas id="rain" aria-hidden="true"></canvas><div id="flash"></div>
<div id="app">
  <header id="hud" hidden>
    <div class="hl"><span id="hudCase">CASE</span></div>
    <div class="hc"><div id="hudClock">11:30 PM</div><div class="tbar"><i id="hudBar"></i></div><div id="hudLeft" class="left"></div></div>
    <div class="hr"><button id="sndBtn" aria-label="Sound">🔊</button><button id="menuBtn" aria-label="Menu">☰</button></div>
  </header>
  <section id="title" class="screen"></section>
  <section id="intro" class="screen" hidden></section>
  <main id="game" hidden>
    <div id="v-scene" class="view"></div>
    <div id="v-suspects" class="view" hidden></div>
    <div id="v-board" class="view" hidden></div>
    <nav id="nav"><button data-v="scene" class="on"><b>🔎</b>Scene</button><button data-v="suspects"><b>👥</b>Suspects</button><button data-v="board"><b>📌</b>Board<i id="boardBadge"></i></button></nav>
  </main>
  <div id="interview" class="ov" hidden>
    <div class="ihead"><button id="iBack" aria-label="Back to case">✕</button><div class="iport" id="iPort"></div>
      <div class="iinfo"><h2 id="iName"></h2><div id="iRole" class="role"></div><div id="iNerve" class="nerve"></div><div id="iStat" class="chip"></div></div></div>
    <div class="ilog" id="iLog" aria-live="polite"></div>
    <div class="iact" id="iAct"></div>
    <div id="stampfx" class="stampfx" hidden>CAUGHT IN A LIE</div>
  </div>
  <div id="sheet" class="sheet" hidden></div>
  <div id="modal" class="modal" hidden><div id="mbox" class="mbox"></div></div>
  <div id="result" class="result" hidden></div>
  <div id="toast" class="toast"></div>
</div>
<script src="content.js"></script><script src="engine.js"></script><script src="art.js"></script><script src="audio.js"></script><script src="ui.js"></script>
</body></html>
